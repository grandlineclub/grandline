<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
  <title>Grand Line Poker Clock</title>
  <style>
    .header {
      background-color: #111;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      border-bottom: 1px solid #444;
    }
    .header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .header a:hover { background-color: #222; }

    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      transition: background-color 0.5s ease;
    }

    #tournamentName { font-size: 32px; font-weight: bold; margin-bottom: 0; margin-top: 140px; }

    #timerContainer {
      display: flex; align-items: center; justify-content: center;
      position: relative; margin-bottom: 1px; flex-direction: column;
    }
    .logo { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    #timer { font-size: 188px; font-weight: bold; margin: 0; line-height: 1; }

    #designerCredit {
      color: #222; position: absolute; right: 10px; top: 0; bottom: 0; margin: auto 0;
      font-size: 14px; font-style: italic; opacity: 0.6; height: fit-content; pointer-events: none;
    }
    #progressBarContainer {
      width: 100%; height: 20px; background-color: #222; border-radius: 10px; overflow: hidden;
      margin-top: 4px; max-width: 600px; position: relative;
    }

    #pauseOverlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 140px; font-weight: bold; color: #00f; display: none; pointer-events: none;
    }

    .info { font-size: 68px; font-weight: bold; font-family: 'Kanit', sans-serif; margin: 1px 0; }

    #nextLevel { font-size: 28px; font-weight: bold; font-family: 'Kanit', sans-serif; color:#FF8F6B; }

    #averageStack { font-size: 28px; font-weight: bold; font-family: 'Kanit', sans-serif; color:#81D8D0; }

    #playerInfo {
      font-size: 28px;
      font-weight: bold;
      font-family: 'Kanit', sans-serif;
      margin-top: 4px;
    }
    #playerInfo .label { color: #FFFFFF; }
    #playerRemain { color: #FFEB3B; }
    #playerBuyIn  { color: #FFEB3B; }

    /* ===== ปุ่มทั่วไป ===== */
    button {
      font-family: 'Kanit', sans-serif;
      font-size: 20px; font-weight: bold; letter-spacing: 0.5px;
      margin: 10px; padding: 12px 26px;
      color: #fff; cursor: pointer;
      background: linear-gradient(180deg, #3a3a3a 0%, #1c1c1c 100%);
      border: 1px solid #555;
      border-radius: 12px;
      box-shadow: 0 4px 0 #0a0a0a, 0 6px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }
    button:hover {
      background: linear-gradient(180deg, #4a4a4a 0%, #262626 100%);
      border-color: #d4af37;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0a0a0a, 0 2px 6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    button:focus-visible { outline: 2px solid #d4af37; outline-offset: 3px; }

    /* ===== แถวควบคุมหลัก ===== */
    .controls {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px;
      max-width: 760px; margin: 6px auto 0;
      padding: 8px 12px; border-radius: 18px;
      background: rgba(255,255,255,0.03); border: 1px solid #222;
    }
    .controls button { min-width: 110px; }
    /* Previous / Next = ทอง */
    .controls button:first-child,
    .controls button:last-child {
      background: linear-gradient(180deg, #e8c766 0%, #a8841f 100%);
      border-color: #f3dc8e; color: #1a1300;
      box-shadow: 0 4px 0 #5c4508, 0 6px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .controls button:first-child:hover,
    .controls button:last-child:hover {
      background: linear-gradient(180deg, #f5d77a 0%, #b8922a 100%);
    }
    /* -30 / +30 = กลมเล็ก */
    .controls button:nth-child(2),
    .controls button:nth-child(4) { min-width: 80px; border-radius: 999px; }
    /* Pause / Play = ปุ่มเด่นสีน้ำเงิน */
    .controls button:nth-child(3) {
      min-width: 150px; font-size: 24px; padding: 14px 30px;
      background: linear-gradient(180deg, #3d6bff 0%, #1631b8 100%);
      border-color: #7b97ff;
      box-shadow: 0 4px 0 #0b1a66, 0 0 18px rgba(61,107,255,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .controls button:nth-child(3):hover { background: linear-gradient(180deg, #5a82ff 0%, #2040d0 100%); }
    .controls button.is-paused {
      background: linear-gradient(180deg, #2ecc71 0%, #138a45 100%);
      border-color: #7ee8a8;
      box-shadow: 0 4px 0 #0a4d26, 0 0 18px rgba(46,204,113,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .controls button.is-paused:hover { background: linear-gradient(180deg, #45d983 0%, #18a052 100%); }
    #progressBar { height: 100%; width: 100%; background: green; transition: width 1s linear, background 0.5s ease; }

    #prizePoolDisplay { font-size: 38px; line-height: 1.6; white-space: pre-line; }

    .input-section { display: flex; justify-content: center; gap: 10px; margin-top: 200px; flex-wrap: wrap; }
    .input-box { display: flex; align-items: center; gap: 10px; }
    .input-box span { font-size: 20px; }
    .input-box {
      padding: 6px 14px; border-radius: 14px;
      background: rgba(255,255,255,0.04); border: 1px solid #2a2a2a;
    }
    .input-box button {
      width: 40px; height: 40px; padding: 0; margin: 4px;
      font-size: 22px; line-height: 1; border-radius: 50%;
    }
    .input-box button:first-of-type { color: #ff7b7b; }
    .input-box button:last-of-type  { color: #7dffb0; }
    .input-box span[id] { min-width: 36px; font-weight: bold; color: #FFEB3B; font-size: 24px; }
    .input-box input {
      background: #111; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 6px 10px;
    }
    .input-box input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 0 2px rgba(212,175,55,0.3); }
    .input-box input { width: 120px; font-size: 18px; text-align: right; }

    #rotatingContainer {
      width: 100%; overflow: hidden; position: relative; height: 38px; margin-top: 6px;
      max-width: 600px; margin-left: auto; margin-right: auto;
    }
    #rotatingMessage {
      display: inline-block; white-space: nowrap; position: absolute; will-change: transform;
      animation: scrollMessage 15s linear infinite; font-size: 28px; color: #ffeb3b; font-family: 'Kanit', sans-serif;
      width: 100%; text-align: center;
    }
    @keyframes scrollMessage {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-150%); }
    }

    /* Start overlay */
    #startButtonOverlay {
      position: fixed; inset: 0; background-color: rgba(0,0,0,0.85);
      display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    #startButton {
      font-size: 40px; padding: 22px 56px; border-radius: 999px;
      background: linear-gradient(180deg, #3d6bff 0%, #1631b8 100%);
      border: 2px solid #7b97ff;
      box-shadow: 0 6px 0 #0b1a66, 0 0 40px rgba(61,107,255,0.6);
      animation: pulseStart 1.8s ease-in-out infinite;
    }
    #startButton:hover { background: linear-gradient(180deg, #5a82ff 0%, #2040d0 100%); }
    @keyframes pulseStart {
      0%, 100% { box-shadow: 0 6px 0 #0b1a66, 0 0 25px rgba(61,107,255,0.45); }
      50%      { box-shadow: 0 6px 0 #0b1a66, 0 0 55px rgba(61,107,255,0.9); }
    }
  </style>
</head>
<body>

  <div id="startButtonOverlay">
    <button id="startButton">Start Clock</button>
  </div>

  <div class="header">
    <a href="index.html">🏠 Home</a>
    <a href="clock1.html">⏰ Clock</a>
    <a href="index.html">🏆 Ranking</a>
    <a href="season.html">☠️ Season Cup</a>
    <a href="drawchart.html">♠️ Out Hit Card</a>
    <a href="preflop.html">🃏 Preflop Range</a>
  </div>

  <div id="tournamentName">ROAD TO WPT PRIME TAIWAN 2027</div>

  <div id="rotatingContainer"><div id="rotatingMessage"></div></div>

  <div id="timerContainer">
    <div style="display: flex; align-items: center; justify-content: center; gap: 30px;">
      <img class="logo" src="https://i.ibb.co/XfSfxGFY/IMG-3351.png" alt="Logo Left" />
      <div id="timer">20:00</div>
      <img class="logo" src="https://i.ibb.co/XfSfxGFY/IMG-3351.png" alt="Logo Right" />
      <div id="pauseOverlay">PAUSE</div>
    </div>
    <div id="progressBarContainer">
      <div id="progressBar"></div>
      <div id="designerCredit">Design by NewZ Sensei</div>
    </div>
  </div>

  <div class="info" id="blinds">100/200</div>
  <div class="info" id="nextLevel">Next level: 200/400 (400)</div>
  <div class="info" id="averageStack">Average Stack: -</div>
  <div id="playerInfo">
    <span class="label">Players:</span>
    <span id="playerRemain">9</span> /
    <span id="playerBuyIn">9</span>
  </div>
  <div class="info" id="prizePoolDisplay" style="display: none;">Prize Pool: -</div>

  <div class="input-section">
    <div class="input-box">
      <span>Remaining:</span>
      <button onclick="adjustRemain(-1)">-</button>
      <span id="remainCount">9</span>
      <button onclick="adjustRemain(1)">+</button>
    </div>
    <div class="input-box">
      <span>Register</span>
      <button onclick="adjustBuyIn(-1)">-</button>
      <span id="buyInCount">9</span>
      <button onclick="adjustBuyIn(1)">+</button>
    </div>
  </div>

  <div class="controls">
    <button onclick="confirmPrevLevel()">Previous</button>
    <button onclick="subtractTime()">-30</button>
    <button onclick="togglePause()"><span id="pausePlayText">Pause</span></button>
    <button onclick="addTime()">+30</button>
    <button onclick="confirmNextLevel()">Next</button>
  </div>

  <div class="input-section" style="margin-top:20px;">
    <div class="input-box">
      <span>Resurrection :</span>
      <input type="text" inputmode="numeric" id="buyInPriceInput" value="300"
             oninput="updateBuyInPrice()" onblur="formatNumberInput(this)" />
    </div>
    <div class="input-box">
      <span>Starting Stack :</span>
      <input type="text" inputmode="numeric" id="startingStackInput" value="20000"
             oninput="updateStartingStack()" onblur="formatNumberInput(this)" />
    </div>
  </div>

  <audio id="alert60Custom" preload="auto" src="https://media.vocaroo.com/mp3/16W8P5xUjNc5"></audio>
  <audio id="countdown"    preload="auto" src="https://media.vocaroo.com/mp3/18yrSTeH2pe3"></audio>
  <audio id="whistleSound" preload="auto" src="https://media.vocaroo.com/mp3/1mS0nADire2c"></audio>

  <script>
    const levels = [
      { blinds: "100 / 200",  duration: 1200 },
      { blinds: "100 / 300",  duration: 1199 },
      { blinds: "200 / 400",  duration: 1199 },
      { blinds: "300 / 600",  duration: 1199 },
      { blinds: "400 / 800",  duration: 1199 },
      { blinds: "500 / 1,000",duration: 1199 },
      { blinds: "600 / 1,200",duration: 1199 },
      { blinds: "800 / 1,600",duration: 1199 },
      { blinds: "1,000 / 2,000", duration: 1199 },
      { blinds: "Break", duration: 899 },
      { blinds: "1,000 / 3,000", duration: 1199 },
      { blinds: "2,000 / 4,000", duration: 1199 },
      { blinds: "3,000 / 6,000", duration: 1199 },
      { blinds: "4,000 / 8,000", duration: 1199 },
      { blinds: "5,000 / 10,000", duration: 1199 },
      { blinds: "7,000 / 15,000", duration: 1199 },
      { blinds: "10,000 / 20,000", duration: 1199 },
      { blinds: "15,000 / 30,000", duration: 1199 },
      { blinds: "20,000 / 40,000", duration: 1199 },
      { blinds: "30,000 / 60,000", duration: 1199 },
      { blinds: "40,000 / 80,000", duration: 1199 },
      { blinds: "50,000 / 100,000", duration: 1199 },
      { blinds: "100,000 / 200,000", duration: 2999 },
    ];

    const messages = [
      "ไม่มีเหตุผลที่ต้องเล่นทุกมือ แต่ทุกมือต้องมีเหตุผลที่เล่น",
      "การบลัฟที่พลาดที่สุด คือการบลัฟตัวเองว่าคุณไม่แพ้",
      "ไพ่ในมือไม่ได้น่ากลัวเท่าความกลัวในใจคุณเอง",
      "ดวงอาจพาคุณไปได้ไกล แต่ฝีมือจะพาคุณไปได้ไกลกว่า",
      "จงใช้สมองในการเล่น และใช้อารมณ์ในการหลอก",
      "บางครั้งการไม่เล่น คือการเล่นที่เฉียบที่สุด",
      "ทุกการหมอบ คือการรักษาทุนไว้รบในตาถัดไป",
      "คนที่แพ้คือคนที่รีบร้อน คนที่ชนะคือคนที่รอได้",
      "ไพ่ที่ดีทำให้ชนะรอบหนึ่ง แต่การควบคุมตัวเองทำให้ชนะทั้งเกม",
      "ความกล้าไม่ได้อยู่ที่การ All in แต่มันอยู่ที่การหมอบ",
      "ฝีมือไม่ได้วัดจากจำนวนครั้งที่ชนะ แต่นับจากจำนวนครั้งที่อ่านเกมได้ถูกต้อง",
      "โป๊กเกอร์ไม่ใช่เรื่องของโชค แต่มันคือการใช้โชคให้คุ้มค่าที่สุด",
      "จงเรียก Value จากผู้เล่น Re-Buy",
      "ที่นี้ Grand Line จงอย่ากลัว เพราะถ้าคุณกลัว มันจะเกิดขึ้นจริง"
    ];

    let currentLevel = 0;
    let timeLeft = levels[currentLevel].duration;
    let countdown;
    let isPaused = false;
    let hasStarted = false;
    let warned60 = false;
    let warned10 = false;
    let warnedEnd = false;

    let buyIn = 9;
    let remain = 9;
    let buyInPrice = 300;
    let startingStack = 20000;

    // อ่านตัวเลขจากช่อง input (ตัด comma / ตัวอักษรอื่นทิ้ง)
    function parseNumberInput(el) {
      return parseInt(el.value.replace(/[^\d]/g, ''), 10) || 0;
    }
    // ใส่ comma ตอนออกจากช่อง (ไม่ใส่ระหว่างพิมพ์ เพื่อไม่ให้ cursor กระโดด)
    function formatNumberInput(el) {
      el.value = parseNumberInput(el).toLocaleString();
    }

    function updateBuyInPrice() {
      buyInPrice = parseNumberInput(document.getElementById("buyInPriceInput"));
      updateDisplay();
    }

    function updateStartingStack() {
      startingStack = parseNumberInput(document.getElementById("startingStackInput"));
      updateDisplay();
    }

    function formatInitialValues() {
      formatNumberInput(document.getElementById("buyInPriceInput"));
      formatNumberInput(document.getElementById("startingStackInput"));
    }

    function calculateBookingBonus() {
      const rake = Math.max(buyInPrice * 0.20, 100);
      return Math.max(0, buyInPrice - rake); // เงินสุทธิหลังหัก rake
    }

    const timerDisplay = document.getElementById("timer");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const pausePlayText = document.getElementById("pausePlayText");
    const blindsDisplay = document.getElementById("blinds");
    const nextLevelDisplay = document.getElementById("nextLevel");
    const averageStackDisplay = document.getElementById("averageStack");
    const playerInfoDisplay = document.getElementById("playerInfo");
    const prizePoolDisplay = document.getElementById("prizePoolDisplay");
    const alert60Custom = document.getElementById("alert60Custom");
    const countdownSound = document.getElementById("countdown");
    const whistleSound = document.getElementById("whistleSound");
    const progressBar = document.getElementById("progressBar");
    const rotatingContainer = document.getElementById("rotatingContainer");
    const rotatingMessage = document.getElementById("rotatingMessage");
    const startButtonOverlay = document.getElementById("startButtonOverlay");
    const startButton = document.getElementById("startButton");

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(timeLeft);
      const currentBlinds = levels[currentLevel].blinds;

      // คำนวณ prize pool ก่อน เพื่อให้รู้ว่ากำลังแสดงอยู่หรือไม่
      updatePrizePool();
      const prizeVisible = prizePoolDisplay.style.display !== "none";

      if (currentBlinds === "Break") {
        blindsDisplay.textContent = "Break";
        rotatingContainer.style.display = prizeVisible ? "none" : "block";
      } else {
        const [sb, bb] = currentBlinds.split('/').map(s => s.trim());
        blindsDisplay.textContent = `${sb} / ${bb} (${bb})`;
        const bbValue = parseInt(bb.replace(/,/g, ''), 10);
        rotatingContainer.style.display = (bbValue >= 1200 || prizeVisible) ? "none" : "block";
      }

      if (currentLevel < levels.length - 1) {
        const next = levels[currentLevel + 1];
        if (next.blinds === "Break") {
          nextLevelDisplay.textContent = "Next level: Break";
        } else {
          const nextBig = next.blinds.split('/')[1].trim();
          nextLevelDisplay.textContent = `Next level: ${next.blinds} (${nextBig})`;
        }
      } else {
        nextLevelDisplay.textContent = "Final Level";
      }

      const totalDuration = levels[currentLevel].duration;
      const percentage = Math.min(100, (timeLeft / totalDuration) * 100);
      progressBar.style.width = percentage + "%";

      if (percentage > 40) {
        progressBar.style.background = "linear-gradient(to right, #00cc66, #aaff00)";
      } else if (percentage > 20) {
        progressBar.style.background = "linear-gradient(to right, #ffee00, #ff9900)";
      } else {
        progressBar.style.background = "linear-gradient(to right, #ff3300, #ff0000)";
      }

      updateAverageStack();
      updatePlayerInfo();

      const elapsed = Math.max(0, levels[currentLevel].duration - timeLeft);
      const msgIndex = Math.floor(elapsed / 120) % messages.length;
      rotatingMessage.textContent = messages[msgIndex];
    }

    function safePlay(audioEl, label) {
      try {
        if (!audioEl.paused) {
          audioEl.pause();
          audioEl.currentTime = 0;
        }
        const p = audioEl.play();
        if (p && typeof p.then === "function") {
          p.catch(err => {
            if (err.name !== "NotAllowedError" && err.name !== "AbortError") {
              console.error(label + " play error:", err);
            }
          });
        }
      } catch (e) {
        console.error(label + " exception:", e);
      }
    }

    function startLevel() {
      timeLeft = levels[currentLevel].duration;
      warned60 = false;
      warned10 = false;
      warnedEnd = false;
      document.body.style.backgroundColor = "#000";
      updateDisplay();

      clearInterval(countdown);
      countdown = setInterval(() => {
        if (isPaused) return;

        timeLeft = Math.max(0, timeLeft - 1);

        if (timeLeft <= 60 && !warned60) {
          safePlay(alert60Custom, "60s");
          warned60 = true;
        }
        if (timeLeft <= 10 && !warned10) {
          safePlay(countdownSound, "10s");
          warned10 = true;
        }

        document.body.style.backgroundColor = (timeLeft <= 10 && timeLeft > 0) ? "#900" : "#000";

        if (timeLeft <= 1 && !warnedEnd) {
          safePlay(whistleSound, "end");
          warnedEnd = true;
        }

        updateDisplay();

        if (timeLeft <= 0) {
          document.body.style.backgroundColor = "#000";
          clearInterval(countdown);
          nextLevel();
        }
      }, 1000);
    }

    function togglePause() {
      isPaused = !isPaused;
      pausePlayText.textContent = isPaused ? "Play" : "Pause";
      pausePlayText.parentElement.classList.toggle("is-paused", isPaused);
      pauseOverlay.style.display = isPaused ? "block" : "none";
    }

    function nextLevel() {
      if (currentLevel < levels.length - 1) {
        currentLevel++;
        startLevel();
      } else {
        clearInterval(countdown);
        timerDisplay.textContent = "つづく";
        blindsDisplay.textContent = "โปรดติดตามตอนต่อไป";
        nextLevelDisplay.textContent = "";
        progressBar.style.width = "0%";
      }
    }

    function prevLevel() {
      if (currentLevel > 0) {
        currentLevel--;
        startLevel();
      }
    }

    function confirmNextLevel() { if (confirm("คุณต้องการ Next ?")) nextLevel(); }
    function confirmPrevLevel() { if (confirm("คุณต้องการ Previous ?")) prevLevel(); }

    // ปรับเวลาได้เฉพาะหลังกด Start แล้ว (กันไม่ให้ startLevel ล้างค่าที่ปรับไว้)
    function addTime() { timeLeft += 30; updateDisplay(); }
    function subtractTime() { timeLeft = Math.max(0, timeLeft - 30); updateDisplay(); }

    function adjustBuyIn(val) {
      if (val > 0) { if (!confirm("มีคนแตกหรอ 55555 ต้องสู้ต่อดิวะ")) return; }
      else if (val < 0) { if (!confirm("ยืนยันลบ ผู้เล่น Buy in ใช่หรือไม่?")) return; }
      buyIn = Math.max(0, buyIn + val);
      document.getElementById("buyInCount").textContent = buyIn;
      updateDisplay();
    }

    function adjustRemain(val) {
      remain = Math.max(0, remain + val);
      document.getElementById("remainCount").textContent = remain;
      updateDisplay();
    }

    function updatePlayerInfo() {
      document.getElementById("playerRemain").textContent = remain;
      document.getElementById("playerBuyIn").textContent = buyIn;
    }

    function updateAverageStack() {
      if (remain <= 0 || buyIn <= 0) {
        averageStackDisplay.textContent = "Average Stack: -";
        return;
      }
      const avg = Math.floor((buyIn * startingStack) / remain);
      averageStackDisplay.style.display = "block";
      averageStackDisplay.textContent = `Average Stack: ${avg.toLocaleString()}`;
    }

    function updatePrizePool() {
      const blindsValue = levels[currentLevel].blinds;
      if (!blindsValue.includes(" / ")) {
        prizePoolDisplay.style.display = "none";
        return;
      }

      const bb = parseInt(blindsValue.split(" / ")[1].replace(/,/g, ''), 10);
      if (bb < 2200) {
        prizePoolDisplay.style.display = "none";
        return;
      }

      prizePoolDisplay.style.display = "block";

      const bookingBonus = calculateBookingBonus(); // เงินสุทธิต่อคนหลังหัก rake
      const totalPrize = Math.floor(bookingBonus * Math.max(0, buyIn - 2));
      const bonus2 = bookingBonus * 2;
      let text = "";

      if (buyIn <= 15) {
        const firstPrize = Math.round(totalPrize / 100) * 100;
        text += `🥇 ${firstPrize.toLocaleString()} + ${bonus2.toLocaleString()} = ${(firstPrize + bonus2).toLocaleString()}`;

      } else if (buyIn <= 23) {
        let firstPrize = Math.round(totalPrize * 0.70 / 100) * 100;
        const secondPrize = Math.round(totalPrize * 0.30 / 100) * 100;
        firstPrize += totalPrize - (firstPrize + secondPrize);

        const bonusSplit = Math.floor(bonus2 / 2);
        text += `🥇 ${firstPrize.toLocaleString()} + ${bonusSplit.toLocaleString()} = ${(firstPrize + bonusSplit).toLocaleString()}<br>`;
        text += `🥈 ${secondPrize.toLocaleString()} + ${bonusSplit.toLocaleString()} = ${(secondPrize + bonusSplit).toLocaleString()}`;

      } else {
        let firstPrize = Math.round(totalPrize * 0.5 / 100) * 100;
        const secondPrize = Math.round(totalPrize * 0.3 / 100) * 100;
        const thirdPrize = Math.round(totalPrize * 0.2 / 100) * 100;
        firstPrize += totalPrize - (firstPrize + secondPrize + thirdPrize);

        text += `🥇 ${firstPrize.toLocaleString()} + ${bonus2.toLocaleString()} = ${(firstPrize + bonus2).toLocaleString()}<br>`;
        text += `🥈 ${secondPrize.toLocaleString()}<br>`;
        text += `🥉 ${thirdPrize.toLocaleString()}`;
      }

      prizePoolDisplay.innerHTML = text;
    }

    function primeAudio(audioEl) {
      if (!audioEl) return;
      try {
        audioEl.volume = 0;
        audioEl.muted = true;
        const p = audioEl.play();
        if (p && typeof p.then === "function") {
          p.then(() => {
            audioEl.pause();
            audioEl.currentTime = 0;
            audioEl.muted = false;
            audioEl.volume = 1;
          }).catch(() => {
            audioEl.muted = false;
            audioEl.volume = 1;
          });
        }
      } catch (_) {}
    }

    startButton.addEventListener('click', () => {
      startButtonOverlay.style.display = 'none';
      hasStarted = true;
      primeAudio(alert60Custom);
      primeAudio(countdownSound);
      primeAudio(whistleSound);
      startLevel();
    });

    formatInitialValues();
    updateDisplay();
  </script>

</body>
</html>
